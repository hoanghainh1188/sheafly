name: CI

on:
  pull_request:
  push:
    branches:
      - sheafly
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test scheduling engine
        run: cargo test -p sheafly-engine

      - name: Test reports (Excel workbook)
        run: cargo test -p sheafly-report

      - name: Test license keys
        run: cargo test -p sheafly-license && cargo test -p sheafly-license --release --test license

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      # The installers ship src-tauri/THIRD_PARTY_LICENSES.txt; a dependency added or
      # updated without regenerating it fails here.
      - name: Third-party licenses are up to date
        run: |
          cargo fetch --locked
          node scripts/third-party-licenses.mjs --check
