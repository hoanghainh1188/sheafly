name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # One app for both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      # 'true' when every Apple secret is set (docs/release-signing.md). Without them the macOS app keeps its
      # ad-hoc signature, as in forks. Every job reads it so the release text is the same whichever creates it.
      MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            patchelf \
            rpm \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The Tauri CLI reads the signing settings from the environment, and an empty variable still counts as set
      # (it would replace the ad-hoc "-" identity with ""), so they are exported only when every secret is there.
      # Some but not all of them fails the build instead of shipping an ad-hoc app by mistake. The .p8 key goes
      # to a file only the runner user can read; secrets never reach the log (printf to files only).
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY"
          set_count=0
          missing=""
          for name in $names; do
            if [ -n "${!name:-}" ]; then set_count=$((set_count + 1)); else missing="$missing $name"; fi
          done
          if [ "$MACOS_SIGNED" != "true" ]; then
            if [ "$set_count" -gt 0 ]; then
              echo "::error::Some Apple signing secrets are set but these are missing:$missing (see docs/release-signing.md)"
              exit 1
            fi
            echo "No Apple signing secrets: the macOS app keeps its ad-hoc signature and is not notarized."
            exit 0
          fi
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path")
          delimiter="EOF_$(uuidgen)"
          {
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter"
            done
            printf 'APPLE_API_KEY_PATH=%s\n' "$key_path"
          } >> "$GITHUB_ENV"
          echo "Signing with a Developer ID and notarizing with an App Store Connect API key."

      # Without the Apple secrets the macOS app gets an ad-hoc signature (bundle.macOS.signingIdentity "-"),
      # so Gatekeeper offers Open Anyway instead of calling it damaged. With them, APPLE_SIGNING_IDENTITY overrides
      # that identity, the app is signed with the hardened runtime (Tauri's default) and notarized, and the ticket
      # is stapled. A draft release is only created for v* tags.
      - name: Build bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Sheafly ${{ github.ref_name }}
          releaseBody: ${{ env.MACOS_SIGNED == 'true' && 'The macOS app is signed with a Developer ID and notarized by Apple. The Windows and Linux installers are not signed. See the assets below for each platform.' || 'Not signed with a developer certificate (macOS has an ad-hoc signature). See the assets below for each platform.' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # lipo always (one app for both kinds of Mac); the signature, Gatekeeper and the stapled ticket only when
      # the app was signed with a Developer ID.
      - name: Check the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::Expected one universal .dmg, found: ${dmgs[*]}"
            exit 1
          fi
          mount="$RUNNER_TEMP/sheafly-dmg"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "${dmgs[0]}" > /dev/null
          trap 'hdiutil detach "$mount" -force > /dev/null || true' EXIT
          apps=("$mount"/*.app)
          app="${apps[0]}"
          if [ ! -d "$app" ]; then
            echo "::error::No .app in ${dmgs[0]}"
            exit 1
          fi
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          archs=$(lipo -archs "$app/Contents/MacOS/$exe")
          echo "Architectures of $exe: $archs"
          for arch in x86_64 arm64; do
            if [[ " $archs " != *" $arch "* ]]; then
              echo "::error::$exe has no $arch slice"
              exit 1
            fi
          done
          if [ "$MACOS_SIGNED" != "true" ]; then
            echo "Not signed with a Developer ID: skipping codesign, spctl and stapler."
            exit 0
          fi
          codesign --verify --strict --deep --verbose=2 "$app"
          spctl -a -vv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          if ! grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"; then
            echo "::error::Gatekeeper does not see a notarized Developer ID app"
            exit 1
          fi
          xcrun stapler validate "$app"

      - name: Remove the App Store Connect key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/apple-api-key"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: sheafly-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # SHA256SUMS.txt for the installers, attached to the draft release (tags) or uploaded as an artifact.
  checksums:
    name: checksums
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Compute SHA-256
        working-directory: bundles
        run: |
          find . -type f -printf '%P\n' | sort > ../files.txt
          xargs -a ../files.txt -d '\n' sha256sum | sed -E 's#  .*/#  #' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: sheafly-sha256sums
          path: SHA256SUMS.txt

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
