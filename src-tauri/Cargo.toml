[package]
name = "sheafly"
version = "1.5.0"
description = "Sheafly: Microsoft Project–style project scheduler, in English and Vietnamese"
authors = ["Harry Nguyen"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sheafly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sheafly-engine = { path = "../crates/engine" }
sheafly-license = { path = "../crates/license" }
sheafly-report = { path = "../crates/report" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2"
csv = "1"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false }
ureq = { version = "3.4.2", features = ["json"] }
keyring = "4.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[dev-dependencies]
rust_xlsxwriter = "0.99.1"
# The license tests sign keys with the development key.
sheafly-license = { path = "../crates/license", features = ["issue"] }
