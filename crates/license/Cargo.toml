[package]
name = "sheafly-license"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sheafly Pro license keys: an ed25519-signed payload, checked offline"
publish = false

[features]
# Signing keys and making new ones: only the key tool and the issuing service need it.
issue = ["dep:getrandom"]

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", optional = true }

[[bin]]
name = "sheafly-keygen"
required-features = ["issue"]

[dev-dependencies]
# The tests sign keys of their own.
sheafly-license = { path = ".", features = ["issue"] }
ed25519-dalek = "2.2"
